include:
  - project: ci/core-cicd
    ref: main
    file: luminet.gitlab-ci.yml
    
.base_transform_config: &base_transform_config
  stage: transform-config

  tags:
    - docker

  script:
    - echo "====== Build ReactJS ======"
    - echo $DEPLOY_ENV
    - echo $STACK_NAME
    - cp ./sg-connect-site/configs/$STACK_NAME/configs.$DEPLOY_ENV.json ./sg-connect-site/configs.json
    - cat ./sg-connect-site/configs.json

  artifacts:
    paths:
      - ./sg-connect-site/configs.json
    expire_in: 1 day

build_noenv:
  stage: build
  script:
  - echo $DOCKER_FILE_PATH
  - docker build --pull -f $DOCKER_FILE_PATH/$DOCKER_FILE_NAME --tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
    --cache-from $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION --cache-from $CI_REGISTRY_IMAGE:latest
    --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg TRANSFORM_CONFIG=$TRANSFORM_CONFIG
    $DOCKER_FILE_PATH
  - docker push $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
  - docker tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION $CI_REGISTRY_IMAGE:latest
  - docker push $CI_REGISTRY_IMAGE:latest
  tags:
  - docker
  extends:
  - ".build:default:image:noenv"
  needs:
  - prepare_vars
  - transform_config
  rules:
  - - if: $MULTI_STAGE == "true"
      when: never
  - - if: $MULTIPLE_IMAGE_ENV == "true"
      when: never
  - - if: $BUILD_PLATFORM != "linux"
      when: never
  - - - if: $CI_COMMIT_TAG =~ /^deploy-/ && $DEPLOY_BY == "rocketor"
        when: on_success