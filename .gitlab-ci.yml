include:
  - project: ci/core-cicd
    ref: main
    file: luminet.gitlab-ci.yml
    
.base_transform_config: &base_transform_config
  stage: transform-config

  tags:
    - docker

  script:
    - echo "====== Build ReactJS ======"
    - echo $DEPLOY_ENV
    - echo $STACK_NAME
    - cp ./src/sg-connect-site/configs/$STACK_NAME/configs.$DEPLOY_ENV.json ./src/sg-connect-site/src/configs.json

  artifacts:
    paths:
      - ./src/sg-connect-site/src/configs.json
    expire_in: 1 day